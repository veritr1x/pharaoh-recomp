# game.toml - everything the kit needs to know about Pharaoh Gold (the GOG
# release of Impressions Games' Pharaoh with its Cleopatra expansion, offline
# installer 2.1.0.15) that is not derivable from the binary. The installer
# ships one executable, Pharaoh.exe (Pharaoh 2.1.0.0, built 2000-08-28), a
# Visual C++ 6 build that renders through DirectDraw and plays sound through
# the Miles Sound System. See docs/analysis.md.
#
# Addresses are guest addresses in the pinned executable. The [hooks] values
# are sentinels: they point into the zero-filled section padding after .rsrc
# (0x0126c590-0x0126cfff; the next page is 0x0126d000, the end of the image),
# which the game never references, so the kit's hooks compile and never fire.
# Each one is annotated with what is known about its site in this game.

[game]
id = "pharaoh"
name = "Pharaoh Gold"
app_name = "PharaohRecomp"
bundle_id = "dev.recompkit.pharaoh"
executable = "Pharaoh.exe"
sha256 = "b21b7d719491bb45dfb324ba95231a5b0960ab25fea1bf3fb21da65da7eca662"
image_base = 0x00400000
# The image ends at 0x0126d000 (13.6 MB of static .data), above the kit's
# default heap start of 0x01000000; the arena starts at 20 MB instead.
heap_base = 0x01400000
entry_point = 0x00562fea
guest_root = 'C:\GOG Games\Pharaoh Gold'
# Where a developer checkout finds the game, relative to the repository root.
# innoextract puts the GOG installer's game directory at original/gog/app;
# tools/setup.py links an installed copy to the same place.
developer_exe = "original/gog/app/Pharaoh.exe"

[translate]
# Ghidra listing directory holding functions.tsv and functions/*.asm,
# relative to the repository root. tools/analyze.py exports them.
listings = "analysis/decompiled/Pharaoh.exe"
# Curated symbols, relative to this directory.
globals = "globals.toml"
# The kit's translator wants a visual-phase counter; this game has none that
# has been audited. Sentinel, and no reads are rewritten.
animation_counter = 0x0126ce00
volatile_reads = []
# Function entries the Ghidra listing lacks. 0x004a98b0 is the routine
# holding the two-level switch at 0x004ab2af, reached only through a
# pointer; see docs/analysis.md.
entry_points = [0x004a98b0]

[hooks]
# Every address here is a sentinel until the listings say otherwise.
# runtime/kernel32.cpp native_frame_clock hooks GetTickCount return addresses.
# The verified per-frame calls instead use timeGetTime (IAT 0x0056f22c):
# returns 0x004d6b79 in FUN_004d6b60, 0x004ddcb8 in FUN_004ddcb0 and
# 0x004d0046 in FUN_004d0040. FUN_004d0280 accumulates the last helper's
# elapsed milliseconds and normally skips drawing until 50 ms have elapsed.
# The outer loop polls this gate; these are not GetTickCount draw waits.
# Keep all five sentinels. See docs/analysis.md, Task 4.2, for the listings
# and the measured 20.10 new frames/s over a 20-second smoke interval.
frame_clock_begin = 0x0126ce10
frame_clock_wait = 0x0126ce14
frame_clock_wait_clamp = 0x0126ce18
frame_clock_clamp_deadline = 0x0126ce20
frame_clock_wait_deadline = 0x0126ce24
# dx/ddraw.cpp: mouse-pointer surface globals, for a host-drawn pointer. The
# game imports SetCursor/LoadCursorA/ShowCursor, so its pointer is probably
# the system cursor, not a DirectDraw surface.
cursor_surface_ptrs = [0x0126ce30, 0x0126ce34]
# host/input_gate.cpp: a DirectInput mouse device and its vtable. This game
# reads the mouse through user32 (GetCursorPos, GetAsyncKeyState, window
# messages), not DirectInput, so these will never be real.
mouse_vtable = 0x0126ce40
mouse_device_ptr = 0x0126ce44
mouse_device_right = 0x0126ce48
# host/smoke_main.cpp: the camera record the smoke script inspects. Not
# identified.
camera = 0x0126ce50

[mods]
# The mod runtime's Populous integrations hook Populous routines by address;
# this game has none of them.
builtin = "none"

[settings]
# The F10 page's rows. The renderer rows (Rendering, UI scale, Wide view,
# Resolution, Frame limit, Textures, World filtering) belong to Populous's
# Direct3D renderer and frame loop and change nothing in this 2D game.
rows = ["window", "performance_overlay", "controls"]

[controls]
# Pharaoh is played with the mouse: the full-height panel down the right of
# the screen holds the minimap and the build menu, and everything is built,
# inspected and cancelled by clicking. Its keyboard does five things, all
# read by the window procedure at 0x00414cd0 (the Ghidra listing has no
# function there; the jump table at 0x00416684, indexed by
# byte[0x416708 + vk - 8], is the WM_KEYDOWN dispatch, and the WM_CHAR arm
# starts at 0x004150c2):
#
# - Arrow keys scroll the map: VK_LEFT/RIGHT/UP/DOWN each call
#   FUN_00407c10(direction, step) and set one of the scroll flags
#   0x00e92e2c-0x00e92e38 that FUN_004cf660 folds into the edge scroll.
#   The step is 1, or 8 while Ctrl is held (0x00e92e20, set by VK_CONTROL).
# - '[' and ']' (WM_CHAR, 0x004150cb/0x004150e9) call FUN_00416ba0, which
#   moves the speed at 0x00e38e6c by -10 and +10, clamped to 10-100, and
#   only on the city screen (0x00e38dda == 1).
# - 'P' (0x00415103) toggles the pause flag 0x00e38e60 and redraws.
# - F1-F4 recall a saved viewpoint (FUN_00416ac0, table 0x00e94ddc);
#   Ctrl+F1-F4 store the current one there (FUN_00416b10).
# - Return confirms: the intro skip, the family name, the briefings and
#   every dialog (smoke/main-menu.script is a sequence of them).
#
# There is no rotate and no zoom in this 2D isometric game, and no overlay
# hotkey: the overlays are panel buttons. Escape is not a menu key either -
# it goes straight to the quit prompt (0x00416278 -> FUN_00538cd0) - and the
# host already holds Escape to release the pointer, so it stays off the pad
# and on the keyboard rows. F5 and F6 are the game's own SetWindowPos /
# ShowWindow toggles; stale window bounds are what caused the 2026-09-14
# camera drift (docs/analysis.md), so they stay off the pad too.
#
# "pad", not "pad+keys": the kit's pad+keys puts a keyboard half over the
# bottom of that right-hand panel and the right stick at its middle. The
# game asks for typed text at two moments only (the family name and save
# names), and both the layout's KEYS tab and select (system keyboard) reach
# a keyboard in one tap.
default_layout = "pad"
pad = "mapped"

[controls.mapped]
# The left stick and the dpad press the game's own arrow keys, so the map
# scrolls without resting a finger on a screen edge - the edge hold is what
# the camera-drift task had to tame. The right stick keeps the kit's cursor
# mode for a physical controller; layouts/pad.tablet.json draws no right
# stick, because a finger on the map is a better pointer than a stick.
left_stick = "arrows"
right_stick = "cursor"
dpad = "arrows"
cursor_speed = 900
cross = "mouse_left"          # build, select, confirm
circle = "mouse_right"        # cancel the held tool, close a panel
square = "key:P"              # pause
triangle = "key:F1"           # go to viewpoint 1; with r2 held, store it
l1 = "key:LeftBracket"        # speed -10
r1 = "key:RightBracket"       # speed +10
l2 = "key:F2"                 # go to viewpoint 2; with r2 held, store it
r2 = "key:LCtrl"              # hold: 8x scroll, and F1/F2 store instead
select = "action:system_keyboard"
start = "key:Return"
l3 = "none"
r3 = "key:Escape"             # the quit prompt, where a thumb cannot reach it
ps = "action:settings"

[launcher]
# The launcher (kit host/launcher/): what it calls the game, the folder names
# and store ids it looks for, where to buy it, and the headroom an import
# leaves free.
title = "Pharaoh Gold"
install_names = ["Pharaoh Gold", "Pharaoh + Cleopatra", "Pharaoh"]
gog_ids = ["1207659046"]  # the goggame-1207659046.info in the supported install
# The GOG release is the one whose executable the pin matches.
store = "https://www.gog.com/game/pharaoh_cleopatra"
# Steam sells the game too; its executable is not checked against the pin,
# so a Steam install is found and then reported if it differs.
steam_ids = ["564530"]
min_free_mb = 600

[setup]
# tools/setup.py: what a supported installation must contain. No annotation
# metadata exists for this executable; tools/analyze.py runs Ghidra's own
# analysis instead of importing one.
required_dirs = ["AUDIO", "BINKS", "Data", "Maps"]

[bundle]
# Left out of bundles and staged game data (iPad and Android): GOG's support
# files, the Windows-only DLLs (Miles Sound System, Bink, Smacker, GOG Galaxy,
# the Games Explorer helper), the Miles provider plug-ins, the manuals and
# the readme. BINKS stays in for FFmpeg playback; the game's .txt model files
# stay in too.
exclude = ["__support", "webcache.zip", "Readme.txt",
           "*.dll", "*.DLL", "*.pdf", "*.ico", "*.hashdb", "*.info",
           "*.M3D", "*.ASI", "*.tsk"]
